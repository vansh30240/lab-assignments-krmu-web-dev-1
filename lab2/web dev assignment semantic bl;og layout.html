<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple blog layout </title>
</head>
<body>

    <!-- Header -->
    <header>
        <h1>My Simple Blog</h1>
        <!-- Navigation -->
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Posts</a></li>
                <li><a href="#">About</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content -->
    <main>
        <section>
            <!-- Article 1 -->
            <article>
                <h2>First Blog Post</h2>
                <p>This is a placeholder for the first blog post. It contains some sample text for demonstration.</p>
            </article>

            <!-- Article 2 -->
            <article>
                <h2>Second Blog Post</h2>
                <p>This is another placeholder article with more example content.</p>
            </article>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>My Simple Blog.</p>
    </footer>

</body>
</html>
